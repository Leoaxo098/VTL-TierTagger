name: Build & Release all MC versions

# Manually triggered. Builds every MC-version branch, gathers all jars
# and publishes them in a single GitHub release tagged with the mod version.
on:
  workflow_dispatch:
    inputs:
      mod_version:
        description: "Release tag / mod version (e.g. 2.6.0)"
        required: true
        type: string
      changelog:
        description: "Changelog / release description (Markdown)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # 1.21.x branches -> Java 21
          - { branch: "1.21", java: "21" }
          - { branch: "1.21.2", java: "21" }
          - { branch: "1.21.4", java: "21" }
          - { branch: "1.21.5", java: "21" }
          - { branch: "1.21.6", java: "21" }
          - { branch: "1.21.9", java: "21" }
          - { branch: "1.21.11", java: "21" }
          # 26.x multiloader branches -> Java 25 toolchain
          - { branch: "26.1", java: "25" }
          - { branch: "26.2", java: "25" }
          - { branch: "26.3", java: "25" }

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace

      - name: Collect jars
        shell: bash
        run: |
          mkdir -p dist
          if [ "${{ matrix.branch }}" = "26.1" ] || [ "${{ matrix.branch }}" = "26.2" ] || [ "${{ matrix.branch }}" = "26.3" ]; then
            # multiloader branches: the fabric jar already bundles the common classes
            find build/libs -name "VTL-TierTagger-fabric-*.jar" ! -name "*-sources*" -exec cp {} dist/ \;
          else
            find build/libs -name "VTL-TierTagger-*.jar" ! -name "*-sources*" -exec cp {} dist/ \;
          fi
          echo "Collected jars:"
          ls -l dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.branch }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: Gather jars & publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download all built jars
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.mod_version }}
          BODY: ${{ inputs.changelog }}
        run: |
          echo "Jars to release:"
          ls -l dist/
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $VERSION already exists - updating assets only"
            gh release upload "$VERSION" dist/*.jar --clobber
          else
            gh release create "$VERSION" dist/*.jar \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --notes "$BODY"
          fi
